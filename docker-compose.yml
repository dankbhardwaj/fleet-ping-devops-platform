services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fleet-ping-app

    ports:
      - "3000:3000"

    env_file:
      - .env.docker

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:3000/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:15-alpine

    container_name: fleet-ping-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: vexaradmin
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: vexar_fleet

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    expose:
      - "5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U vexaradmin -d vexar_fleet"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata: