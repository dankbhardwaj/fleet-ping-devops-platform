services:
  app:
    build: .

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      DB_HOST: db
      NODE_ENV: production

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: postgres:15

    environment:
      POSTGRES_DB: vexar_fleet
      POSTGRES_USER: vexaradmin
      POSTGRES_PASSWORD: change_me

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vexaradmin -d vexar_fleet"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  pgdata:
