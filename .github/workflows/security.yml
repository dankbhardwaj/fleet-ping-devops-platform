name: Security Scan

on:

  push:

  pull_request:

jobs:

  trivy:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Build Docker Image

        run: docker build -t fleet-ping .

      - name: Run Trivy

        uses: aquasecurity/trivy-action@0.28.0

        with:

          image-ref: fleet-ping

          format: table

          exit-code: 1

          severity: CRITICAL,HIGH
